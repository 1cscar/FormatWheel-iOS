# Generate the Xcode project with:  xcodegen generate
# The .xcodeproj is not committed. Run scripts/fetch-ffmpeg.sh first (Vendor/FFmpeg).
name: FormatWheel
options:
  # Bundle ID io.github.1cscar.formatwheel; forks replace "1cscar" (see README → 「修改 Bundle ID」).
  bundleIdPrefix: io.github.1cscar
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  FormatWheelCore:
    path: Packages/FormatWheelCore
  FormatWheelArt:
    path: Packages/FormatWheelArt

targets:
  FormatWheel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Info.plist"
    dependencies:
      # Dynamic library products: shared by the app and the hosted test bundles, so they must be embedded.
      - package: FormatWheelCore
        embed: true
      - package: FormatWheelArt
        embed: true
    settings:
      base:
        PRODUCT_NAME: FormatWheel
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1cscar.formatwheel
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FormatWheel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        ENABLE_PREVIEWS: YES

  CoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CoreTests
    dependencies:
      - target: FormatWheel
      - package: FormatWheelCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1cscar.formatwheel.CoreTests
        GENERATE_INFOPLIST_FILE: YES

  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: FormatWheel
      - package: FormatWheelCore
      - package: FormatWheelArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.1cscar.formatwheel.AppTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FormatWheel:
    build:
      targets:
        FormatWheel: all
        CoreTests: [test]
        AppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CoreTests
        - AppTests
    archive:
      config: Release
