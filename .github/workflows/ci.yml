name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen ldid

      - name: FormatWheelArt package tests (macOS)
        run: swift test --package-path Packages/FormatWheelArt

      - name: Fetch prebuilt FFmpeg
        run: scripts/fetch-ffmpeg.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Unit tests (iOS Simulator)
        run: scripts/test.sh -quiet

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: build/TestResults-*.xcresult
          retention-days: 7

      - name: Unsigned Release build and IPA
        run: scripts/build-unsigned.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: FormatWheel-ipa
          path: |
            dist/FormatWheel.ipa
            dist/FormatWheel.tipa
          retention-days: 14
